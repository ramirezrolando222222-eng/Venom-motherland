name: VENOM Motherland CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint Backend (Basic Check)
        run: |
          python -m py_compile backend/venom_core.py

  build-docker:
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t venom-backend -f docker/Dockerfile.backend .

      - name: Build Frontend Docker Image
        run: |
          docker build -t venom-frontend -f docker/Dockerfile.frontend .

  system-validation:
    runs-on: ubuntu-latest
    needs: build-docker

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Folder Structure
        run: |
          test -f backend/venom_core.py
          test -f frontend/index.html
          test -f docker/docker-compose.yml

      - name: Print System Status
        run: |
          echo "VENOM MOTHERLAND SYSTEM VALIDATION COMPLETE"
          echo "STATE: READY FOR DEPLOYMENT"
          
