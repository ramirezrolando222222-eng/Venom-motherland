name: VENOM Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pip-audit

      - name: Scan Dependencies
        run: |
          pip-audit || true

  secrets-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan for Secrets
        uses: gitleaks/gitleaks-action@v2

  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linter
        run: |
          pip install flake8

      - name: Run Lint Check
        run: |
          flake8 backend || true
