name: VENOM Motherland Monitoring

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:

  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Backend Health (WebSocket)
        run: |
          echo "Checking VENOM CORE availability..."
          curl -f http://localhost:8765 || echo "CORE OFFLINE (expected in CI runners)"

  system-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Core Files
        shell: bash
        run: |
          echo "========================================"
          echo "VENOM MOTHERLAND REPOSITORY AUDIT"
          echo "========================================"

          missing=0

          check_file() {
            local file="$1"

            if [ -f "$file" ]; then
              echo "OK      : $file"
            else
              echo "MISSING : $file"
              missing=$((missing + 1))
            fi
          }

          check_file "backend/venom_core.py"
          check_file "backend/gateway.py"
          check_file "frontend/index.html"

          echo
          echo "----------------------------------------"

          if [ "$missing" -eq 0 ]; then
            echo "STATUS: CORE FILE STRUCTURE COMPLETE"
          else
            echo "STATUS: APPLICATION STRUCTURE INCOMPLETE"
            echo "Missing files: $missing"
            echo "MONITORING REMAINS ACTIVE"
          fi

          echo
          echo "Repository audit completed safely."

      - name: Audit State Design
        run: |
          echo "Checking VENOM architecture integrity..."
          grep -r "WORKERS" backend/ || true
          grep -r "VAULT" backend/ || true
          grep -r "TIMEX" backend/ || true
          echo "AUDIT COMPLETE"

  heartbeat-log:
    runs-on: ubuntu-latest

    steps:
      - name: Generate System Heartbeat
        run: |
          echo "==============================="
          echo "VENOM MOTHERLAND HEARTBEAT"
          echo "STATUS: MONITORING ACTIVE"
          echo "TIMESTAMP: $(date)"
          echo "==============================="
