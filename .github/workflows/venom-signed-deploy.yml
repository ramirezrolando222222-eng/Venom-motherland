7name: VENOM Signed Deployment

on:
  push:
    branches: [ main ]

jobs:

  verify-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Structure
        run: |
          test -f backend/venom_core.py
          test -f frontend/index.html
          test -f docker/docker-compose.yml

      - name: Generate Build Hash
        run: |
          find . -type f -not -path "./.git/*" | sort | xargs sha256sum > build.hash
          cat build.hash

      - name: Upload Hash Artifact
        uses: actions/upload-artifact@v4
        with:
          name: venom-build-hash
          path: build.hash

  sign-build:
    runs-on: ubuntu-latest
    needs: verify-build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Signature File
        run: |
          echo "VENOM_SIGNED_BUILD=$(date +%s)" > signature.txt
          echo "OWNER: Rolando H Ramirez Jr" >> signature.txt
          sha256sum signature.txt > signature.sig

      - name: Upload Signature
        uses: actions/upload-artifact@v4
        with:
          name: venom-signature
          path: |
            signature.txt
            signature.sig

  dep
deploy:
  runs-on: ubuntu-latest
  needs: [verify-build, sign-build]

  steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Signature Artifact
      uses: actions/download-artifact@v4
      with:
        name: venom-signature

    - name: Verify Signature Exists
      run: |
        ls -la
        test -f signature.txt
        echo "SIGNATURE VERIFIED"

    - name: Deploy via SSH (Only Signed Builds)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VENOM_HOST }}
        username: ${{ secrets.VENOM_USER }}
        key: ${{ secrets.VENOM_SSH_KEY }}
        script: |
          set -e

          cd ~/venom-motherland

          echo "DEPLOYING VENOM..."

          git pull origin main

          docker compose down || true
          docker compose up -d --build

          echo "VENOM DEPLOY COMPLETE"

